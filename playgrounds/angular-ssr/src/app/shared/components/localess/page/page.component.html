@if (data(); as data) {
  <main class="flex flex-col gap-4">
    <h1 class="text-center" data-ll-field="title">{{data.title}}</h1>
    <p class="text-center whitespace-pre-line" data-ll-field="description">{{data.description}}</p>
    <div class="flex justify-center gap-2">
      <ll-component [data]="data.buttons" [links]="links()" [references]="references()" [assets]="assets()" />
    </div>
  </main>
}
