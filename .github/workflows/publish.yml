name: Publish to npm

on:
  push:
    branches: [main, dev]
permissions:
  id-token: write
  contents: read
jobs:
  publish:
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Use Node.js 24.x
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
          registry-url: 'https://registry.npmjs.org/'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # build.yml covers pull requests, but a direct push to main lands here with nothing having
      # gated it, and published versions are immutable. Lint, build and test run inside the
      # publishing job so the exact tree that reaches the registry is the one that passed.
      - name: Lint
        run: npm run lint

      # Package manifests carry `"@localess/*": "*"` in the repository; the exact version is
      # applied here. Must run before the build so ng-packagr copies the stamped values into
      # its generated manifest.
      - name: Set publish version
        run: node scripts/set-publish-version.mjs

      - name: Build all packages
        run: npm run build

      # test:coverage, not test: it runs the same suites and additionally enforces the per-package
      # coverage thresholds, so this one step subsumes everything build.yml checked on push.
      - name: Test all packages with coverage thresholds
        run: npm run test:coverage

      - name: Verify publish manifests
        run: node scripts/verify-publish-manifests.mjs

      # Inspects the tarballs npm would actually upload. The manifest checks above read
      # package.json; this reads what ships, which is how @localess/angular went out as raw
      # TypeScript with no entry points and still passed everything else.
      - name: Pack smoke test
        run: node scripts/pack-smoke-test.mjs

      - name: Publish all packages to npm
        run: |
          for pkgdir in packages/*/; do
            if grep -q '"private"\s*:\s*true' "${pkgdir}package.json"; then
              continue
            fi

            # ng-packagr libraries are published from their build output: the generated
            # manifest there carries `module`, `typings` and `exports`, which the source
            # package.json does not. Publishing the source directory yields a tarball with no
            # entry points at all, which cannot be imported.
            publishdir="$pkgdir"
            if [ -f "${pkgdir}ng-package.json" ]; then
              dest=$(jq -r '.dest // "dist"' "${pkgdir}ng-package.json")
              publishdir="${pkgdir}${dest#./}"
            fi

            echo "Publishing $pkgdir from $publishdir"
            ( cd "$publishdir" && npm publish --access public --provenance --ignore-scripts )
          done
        shell: bash

  publish-snapshot:
    if: github.ref_name == 'dev'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Use Node.js 24.x
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
          registry-url: 'https://registry.npmjs.org/'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # build.yml covers pull requests, but a direct push to main lands here with nothing having
      # gated it, and published versions are immutable. Lint, build and test run inside the
      # publishing job so the exact tree that reaches the registry is the one that passed.
      - name: Lint
        run: npm run lint

      - name: Set snapshot publish version
        run: |
          DATE=$(date +"%Y%m%d%H%M%S")
          VERSION="$(node -p "require('./package.json').version")-dev.${DATE}"
          echo "Publishing snapshot version: $VERSION"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          node scripts/set-publish-version.mjs "$VERSION"
        shell: bash

      - name: Build all packages
        run: npm run build

      # test:coverage, not test: it runs the same suites and additionally enforces the per-package
      # coverage thresholds, so this one step subsumes everything build.yml checked on push.
      - name: Test all packages with coverage thresholds
        run: npm run test:coverage

      - name: Verify publish manifests
        run: node scripts/verify-publish-manifests.mjs "$VERSION"

      # Inspects the tarballs npm would actually upload. The manifest checks above read
      # package.json; this reads what ships, which is how @localess/angular went out as raw
      # TypeScript with no entry points and still passed everything else.
      - name: Pack smoke test
        run: node scripts/pack-smoke-test.mjs

      - name: Publish all packages to npm with tag 'dev'
        run: |
          for pkgdir in packages/*/; do
            if grep -q '"private"\s*:\s*true' "${pkgdir}package.json"; then
              continue
            fi

            # ng-packagr libraries are published from their build output: the generated
            # manifest there carries `module`, `typings` and `exports`, which the source
            # package.json does not. Publishing the source directory yields a tarball with no
            # entry points at all, which cannot be imported.
            publishdir="$pkgdir"
            if [ -f "${pkgdir}ng-package.json" ]; then
              dest=$(jq -r '.dest // "dist"' "${pkgdir}ng-package.json")
              publishdir="${pkgdir}${dest#./}"
            fi

            echo "Publishing $pkgdir from $publishdir"
            ( cd "$publishdir" && npm publish --tag dev --access public --provenance --ignore-scripts )
          done
        shell: bash
