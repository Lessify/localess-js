name: Publish to npm

on:
  push:
    branches: [main, dev]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # required for OIDC / Trusted Publisher
      contents: read

    steps:
      - uses: actions/checkout@v6

      - name: Use Node.js 20.x
        uses: actions/setup-node@v6
        with:
          node-version: 20.x
          registry-url: 'https://registry.npmjs.org/'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Resolve publish version
        id: version
        run: |
          BASE=$(node -p "require('./package.json').version")
          if [ "${{ github.ref_name }}" = "dev" ]; then
            DATE=$(date +"%Y%m%d%H%M%S")
            VERSION="${BASE}-dev.${DATE}"
            echo "tag=dev" >> "$GITHUB_OUTPUT"
          else
            VERSION="$BASE"
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Sync versions across packages
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          for pkgdir in packages/*/; do
            pkg="${pkgdir}package.json"
            jq --arg v "$VERSION" '
              .version = $v |
              if .dependencies then
                .dependencies |= with_entries(if .key | startswith("@localess/") then .value = $v else . end)
              else . end |
              if .peerDependencies then
                .peerDependencies |= with_entries(if .key | startswith("@localess/") then .value = $v else . end)
              else . end
            ' "$pkg" > tmp.json && mv tmp.json "$pkg"
          done
        shell: bash

      - name: Build all packages
        run: npm run build

      - name: Publish all packages
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          for pkgdir in packages/*/; do
            if ! grep -q '"private"\s*:\s*true' "${pkgdir}package.json"; then
              npm publish --tag "$TAG" --access public --provenance --workspace "$pkgdir"
            fi
          done
        shell: bash
