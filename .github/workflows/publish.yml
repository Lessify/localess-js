name: Publish to npm

on:
  push:
    branches: [main, dev]
permissions:
  id-token: write
  contents: read
jobs:
  publish:
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Use Node.js 24.x
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
          registry-url: 'https://registry.npmjs.org/'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Sync versions from root package.json
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "Publishing version: $VERSION"
          for pkgdir in packages/*/; do
            pkg="${pkgdir}package.json"
            jq --arg v "$VERSION" '
              .version = $v |
              if .dependencies then
                .dependencies |= with_entries(if .key | startswith("@localess/") then .value = $v else . end)
              else . end |
              if .peerDependencies then
                .peerDependencies |= with_entries(if .key | startswith("@localess/") then .value = $v else . end)
              else . end
            ' "$pkg" > tmp.json && mv tmp.json "$pkg"
          done
        shell: bash

      - name: Verify target versions are unpublished
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "Checking npm for existing ${VERSION} releases..."
          conflicts=()
          for pkgdir in packages/*/; do
            if grep -q '"private"\s*:\s*true' "${pkgdir}package.json"; then
              continue
            fi
            name=$(node -p "require('./${pkgdir}package.json').name")
            if npm view "${name}@${VERSION}" version >/dev/null 2>&1; then
              conflicts+=("${name}@${VERSION}")
            fi
          done
          if [ ${#conflicts[@]} -gt 0 ]; then
            echo "::error::Refusing to publish. These versions already exist on npm and are immutable:"
            printf '::error::  %s\n' "${conflicts[@]}"
            echo "::error::Bump the root package.json version (npm run version:patch) and retry."
            exit 1
          fi
          echo "All packages clear to publish at ${VERSION}."
        shell: bash

      - name: Build all packages
        run: npm run build

      - name: Publish all packages to npm
        run: |
          for pkgdir in packages/*/; do
            if grep -q '"private"\s*:\s*true' "${pkgdir}package.json"; then
              continue
            fi

            # ng-packagr libraries are published from their build output: the generated
            # manifest there carries `module`, `typings` and `exports`, which the source
            # package.json does not. Publishing the source directory yields a tarball with no
            # entry points at all, which cannot be imported.
            publishdir="$pkgdir"
            if [ -f "${pkgdir}ng-package.json" ]; then
              dest=$(jq -r '.dest // "dist"' "${pkgdir}ng-package.json")
              publishdir="${pkgdir}${dest#./}"
            fi

            echo "Publishing $pkgdir from $publishdir"
            ( cd "$publishdir" && npm publish --access public --provenance --ignore-scripts )
          done
        shell: bash

  publish-snapshot:
    if: github.ref_name == 'dev'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Use Node.js 24.x
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
          registry-url: 'https://registry.npmjs.org/'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Set snapshot version from root package.json
        run: |
          DATE=$(date +"%Y%m%d%H%M%S")
          VERSION="$(node -p "require('./package.json').version")-dev.${DATE}"
          echo "Publishing snapshot version: $VERSION"
          for pkgdir in packages/*/; do
            pkg="${pkgdir}package.json"
            jq --arg v "$VERSION" '
              .version = $v |
              if .dependencies then
                .dependencies |= with_entries(if .key | startswith("@localess/") then .value = $v else . end)
              else . end |
              if .peerDependencies then
                .peerDependencies |= with_entries(if .key | startswith("@localess/") then .value = $v else . end)
              else . end
            ' "$pkg" > tmp.json && mv tmp.json "$pkg"
          done
        shell: bash

      - name: Build all packages
        run: npm run build

      - name: Publish all packages to npm with tag 'dev'
        run: |
          for pkgdir in packages/*/; do
            if grep -q '"private"\s*:\s*true' "${pkgdir}package.json"; then
              continue
            fi

            # ng-packagr libraries are published from their build output: the generated
            # manifest there carries `module`, `typings` and `exports`, which the source
            # package.json does not. Publishing the source directory yields a tarball with no
            # entry points at all, which cannot be imported.
            publishdir="$pkgdir"
            if [ -f "${pkgdir}ng-package.json" ]; then
              dest=$(jq -r '.dest // "dist"' "${pkgdir}ng-package.json")
              publishdir="${pkgdir}${dest#./}"
            fi

            echo "Publishing $pkgdir from $publishdir"
            ( cd "$publishdir" && npm publish --tag dev --access public --provenance --ignore-scripts )
          done
        shell: bash
