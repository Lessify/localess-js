name: Build Continues Integration

# Pull requests only. Pushes to main and dev run the same lint/build/test/coverage steps inside
# publish.yml, which has to gate on them anyway before it reaches the registry.
on:
  pull_request:
    branches: [ main, dev ]
jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [ 24.x ]

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify package lists are current
        run: node scripts/verify-publish-order.mjs

      - name: Lint
        run: npm run lint

      - name: Build all packages
        run: npm run build

      # Runs the same suites as `npm test` and additionally enforces the coverage thresholds.
      - name: Test all packages with coverage thresholds
        run: npm run test:coverage
